name: Backpatch demo

on:
  push:
  workflow_dispatch:

jobs:
  backpatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Demo mode fixture report
        run: |
          echo "## Demo mode fixture report" >> "$GITHUB_STEP_SUMMARY"
          echo "SafeToRemove: tough-cookie override (after-only sailshq fixture)" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Demo mode::Fixture report only (no API key required)."
          exit 0
