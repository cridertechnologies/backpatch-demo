name: Backpatch demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backpatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Try live Backpatch Action
        id: live
        continue-on-error: true
        uses: cridertechnologies/backpatch-action@v1
        with:
          api-key: ${{ secrets.BACKPATCH_API_KEY }}
          fail-on: never

      - name: Demo mode fixture report
        if: steps.live.outcome != 'success'
        run: |
          set -euo pipefail
          {
            echo "## Backpatch demo — report-only (demo mode)"
            echo
            echo "> Live API analysis was skipped or failed (missing or invalid \`BACKPATCH_API_KEY\`)."
            echo "> Showing the **after-only fixture expectation** so this public demo stays honest and green."
            echo
            echo "| Package | Override | Expected status | Notes |"
            echo "| --- | --- | --- | --- |"
            echo "| \`@sailshq/request@2.88.3\` | \`tough-cookie@4.1.3\` | **SafeToRemove** | Parent already declares exact \`tough-cookie@4.1.3\`; override is redundant. Report-only — you review; you decide. |"
            echo
            echo "**Claim bar:** trial + \`fail-on: never\`. Not a delete guarantee."
            echo
            echo "**Try it:** [Action quickstart](https://backpatch.dev/action?utm_source=github&utm_medium=demo_repo&utm_campaign=action_try)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Demo mode::Live backpatch-action did not succeed; wrote honest fixture report and exiting 0."
          exit 0

      - name: Live API succeeded
        if: steps.live.outcome == 'success'
        run: echo "::notice title=Live API::backpatch-action@v1 completed with fail-on: never."
