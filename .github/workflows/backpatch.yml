name: Backpatch demo
# demo CI — report-only

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backpatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Report stale overrides (fail-on: never)"
        uses: cridertechnologies/backpatch-action@v1
        with:
          api-key: ${{ secrets.BACKPATCH_API_KEY }}
          fail-on: never
